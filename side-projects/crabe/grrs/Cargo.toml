[package]
name = "grrs"
version = "0.1.0"
edition = "2024"
authors = ["mokotanin <titchou68@gmail.com>"]
license = "MIT"
description = "A tool to search files"
readme = "README.md"
keywords = ["cli", "search", "demo"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4.34"
env_logger = "0.11.11"
clap-verbosity-flag = "3.0.4"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.4"
assert_fs = "1.1.1"
