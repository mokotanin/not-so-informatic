name: Deploy Rust Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      apps:
        description: "Apps à builder (vide = toutes). Ex: grrs gruyere"
        required: false
        default: ""
        type: string
      draft:
        description: "Create a draft release"
        required: false
        default: false
        type: boolean
      linux:
        description: "Build for Linux"
        required: false
        default: true
        type: boolean
      windows:
        description: "Build for Windows"
        required: false
        default: true
        type: boolean
      macos:
        description: "Build for macOS"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Découverte automatique des projets dans side-projects/crabe/
  # ─────────────────────────────────────────────────────────
  discover:
    name: Discover Rust projects
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: List projects
        id: list
        shell: bash
        env:
          SELECTED_APPS: ${{ inputs.apps }}
          BUILD_LINUX: ${{ inputs.linux }}
          BUILD_WINDOWS: ${{ inputs.windows }}
          BUILD_MACOS: ${{ inputs.macos }}
        run: |
          set -e
          apps="[]"
          selected="$SELECTED_APPS"
          echo "Filtre demandé : '${selected}'"

          targets=$(jq -cn \
            --argjson linux "$BUILD_LINUX" \
            --argjson windows "$BUILD_WINDOWS" \
            --argjson macos "$BUILD_MACOS" \
            '[(if $linux then {target: "x86_64-unknown-linux-gnu", os: "ubuntu-latest", ext: ""} else empty end),
              (if $windows then {target: "x86_64-pc-windows-msvc", os: "windows-latest", ext: ".exe"} else empty end),
              (if $macos then {target: "aarch64-apple-darwin", os: "macos-latest", ext: ""} else empty end)]')
          echo "Plateformes retenues : $targets"

          if [ -d side-projects/crabe ]; then
            for dir in side-projects/crabe/*/; do
              [ -d "$dir" ] || continue
              [ -f "${dir}Cargo.toml" ] || continue
              name=$(basename "$dir")

              # Si un filtre est fourni, ne garder que les apps demandées
              if [ -n "$selected" ] && ! echo " $selected " | grep -q " $name "; then
                echo "⏭️  $name : filtré"
                continue
              fi

              echo "✅ $name : retenu"
              apps=$(echo "$apps" | jq -c --arg n "$name" '. + [$n]')
            done
          fi

          echo "Apps retenues : $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Fail if no apps or platforms selected
        if: steps.list.outputs.apps == '[]' || steps.list.outputs.targets == '[]'
        run: |
          if [ "${{ steps.list.outputs.apps }}" = "[]" ]; then
            echo "::error::Aucun projet Rust à builder (vérifie le filtre 'apps' ou side-projects/crabe/)"
          else
            echo "::error::Sélectionne au moins une plateforme (Linux, Windows ou macOS)"
          fi
          exit 1

  # ─────────────────────────────────────────────────────────
  # 2. Build : app × target
  # ─────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.app }} → ${{ matrix.target.target }}
    needs: discover
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: side-projects/crabe/${{ matrix.app }} -> target

      - name: Build release
        working-directory: side-projects/crabe/${{ matrix.app }}
        run: cargo build --release --target ${{ matrix.target.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -e
          BIN_NAME=$(grep -m1 '^name' side-projects/crabe/${{ matrix.app }}/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$BIN_NAME" ] || BIN_NAME="${{ matrix.app }}"

          case "${{ matrix.target.target }}" in
            x86_64-unknown-linux-gnu)   LABEL="linux-x64"   ;;
            x86_64-pc-windows-msvc)     LABEL="windows-x64" ;;
            aarch64-apple-darwin)       LABEL="macos-arm64" ;;
            *)                          LABEL="${{ matrix.target.target }}" ;;
          esac

          SRC="side-projects/crabe/${{ matrix.app }}/target/${{ matrix.target.target }}/release/${BIN_NAME}${{ matrix.target.ext }}"
          OUT="${{ matrix.app }}-${LABEL}${{ matrix.target.ext }}"

          [ -f "$SRC" ] || { echo "::error::Binaire introuvable : $SRC"; ls -la "side-projects/crabe/${{ matrix.app }}/target/${{ matrix.target }}/release/" || true; exit 1; }
          cp "$SRC" "$OUT"
          echo "ARTIFACT_NAME=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.target.target }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # 3. Une release par app
  # ─────────────────────────────────────────────────────────
  release:
    name: Release ${{ matrix.app }}
    needs: [discover, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - name: Check tag doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/refs/tags/${{ matrix.app }}-v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Le tag ${{ matrix.app }}-v${{ inputs.version }} existe déjà"
            exit 1
          fi

      - name: Download artifacts for ${{ matrix.app }}
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: ${{ matrix.app }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app }}-v${{ inputs.version }}
          name: ${{ matrix.app }} v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
