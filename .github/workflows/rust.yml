name: Rust Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.app }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        app:
          - etchebest
          - grrs
          - gruyere
          - rmtui

        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          APP="${TAG%-v*}"

          if [ "$APP" != "${{ matrix.app }}" ]; then
            echo "Skipping ${{ matrix.app }} for tag $TAG"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: ${{ matrix.app }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release
        shell: bash
        run: |
          APP="${{ matrix.app }}"
          VERSION="${GITHUB_REF_NAME#*-}"
          SUFFIX="${{ matrix.suffix }}"

          mkdir -p release

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$APP/target/${{ matrix.target }}/release/$APP.exe" \
              "release/${APP}-${VERSION}-${SUFFIX}.exe"
          else
            cp "$APP/target/${{ matrix.target }}/release/$APP" \
              "release/${APP}-${VERSION}-${SUFFIX}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.suffix }}
          path: release/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
