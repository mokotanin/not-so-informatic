name: Rust Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get application
        id: app
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP="${TAG%-v*}"
          VERSION="v${TAG#*-v}"

          case "$APP" in
            etchebest|grrs|gruyere|rmtui)
              ;;
            *)
              echo "Unknown application: $APP"
              exit 1
              ;;
          esac

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: ${{ steps.app.outputs.app }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APP="${{ steps.app.outputs.app }}"
          VERSION="${{ steps.app.outputs.version }}"

          mkdir release

          cp "$APP/target/${{ matrix.target }}/release/$APP" \
            "release/${APP}-${VERSION}-linux-x86_64"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          APP="${{ steps.app.outputs.app }}"
          VERSION="${{ steps.app.outputs.version }}"

          mkdir release

          cp "$APP/target/${{ matrix.target }}/release/$APP.exe" \
            "release/${APP}-${VERSION}-windows-x86_64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: release/*

  publish:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
