name: Deploy Rust Apps

on:
  push:
    branches: [main, master]
    paths:
      - "crabe/**"
      - ".github/workflows/deploy-rust.yml"
  pull_request:
    paths:
      - "crabe/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Découverte automatique des projets dans crabe/
  # ─────────────────────────────────────────────────────────
  discover:
    name: Discover Rust projects
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List projects (any dir in crabe/ with a Cargo.toml)
        id: list
        shell: bash
        run: |
          set -e
          apps="[]"
          if [ -d crabe ]; then
            for dir in crabe/*/; do
              [ -d "$dir" ] || continue
              if [ -f "${dir}Cargo.toml" ]; then
                name=$(basename "$dir")
                apps=$(echo "$apps" | jq -c --arg n "$name" '. + [$n]')
              fi
            done
          fi
          echo "Découverts : $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - name: Fail if no project found
        if: steps.list.outputs.apps == '[]'
        run: |
          echo "::error::Aucun projet Rust trouvé dans crabe/ (Cargo.toml manquant ?)"
          exit 1

  # ─────────────────────────────────────────────────────────
  # 2. Build de chaque app × OS
  # ─────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.app }} → ${{ matrix.target }}
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crabe/${{ matrix.app }} -> target

      - name: Build release
        working-directory: crabe/${{ matrix.app }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -e
          # Nom du binaire = nom du crate déclaré dans Cargo.toml (fallback: nom du dossier)
          BIN_NAME=$(grep -m1 '^name' crabe/${{ matrix.app }}/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$BIN_NAME" ] || BIN_NAME="${{ matrix.app }}"

          SRC="crabe/${{ matrix.app }}/target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}"
          OUT="${{ matrix.app }}-${{ matrix.target }}${{ matrix.ext }}"

          if [ ! -f "$SRC" ]; then
            echo "::warning::Binaire introuvable à $SRC — dossier listing :"
            ls -la "crabe/${{ matrix.app }}/target/${{ matrix.target }}/release/" || true
            exit 1
          fi
          cp "$SRC" "$OUT"
          echo "ARTIFACT_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.target }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # 3. Release GitHub (uniquement sur tag v* ou manuel)
  # ─────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [discover, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List
        run: find ./artifacts -type f -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
