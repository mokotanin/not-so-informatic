name: Deploy Rust Apps

on:
  push:
    branches: [main, master]
    paths:
      - "crabe/**"
      - ".github/workflows/deploy-rust.yml"
  pull_request:
    paths:
      - "crabe/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Découverte automatique des projets dans crabe/
  # ─────────────────────────────────────────────────────────
  discover:
    name: Discover Rust projects
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: List projects
        id: list
        shell: bash
        run: |
          set -e
          apps="[]"
          if [ -d crabe ]; then
            for dir in crabe/*/; do
              [ -d "$dir" ] || continue
              if [ -f "${dir}Cargo.toml" ]; then
                apps=$(echo "$apps" | jq -c --arg n "$(basename "$dir")" '. + [$n]')
              fi
            done
          fi
          echo "Découverts : $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - name: Fail if empty
        if: steps.list.outputs.apps == '[]'
        run: |
          echo "::error::Aucun projet Rust trouvé dans crabe/"
          exit 1

  # ─────────────────────────────────────────────────────────
  # 2. Build : app × target  (os/ext fournis par include)
  # ─────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.app }} → ${{ matrix.target }}
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crabe/${{ matrix.app }} -> target

      - name: Build release
        working-directory: crabe/${{ matrix.app }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -e
          BIN_NAME=$(grep -m1 '^name' crabe/${{ matrix.app }}/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$BIN_NAME" ] || BIN_NAME="${{ matrix.app }}"

          SRC="crabe/${{ matrix.app }}/target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}"
          OUT="${{ matrix.app }}-${{ matrix.target }}${{ matrix.ext }}"

          [ -f "$SRC" ] || { echo "::error::Binaire introuvable : $SRC"; ls -la "crabe/${{ matrix.app }}/target/${{ matrix.target }}/release/" || true; exit 1; }
          cp "$SRC" "$OUT"
          echo "ARTIFACT_NAME=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.target }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # 3. Release + SHA256SUMS
  # ─────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [discover, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: ./artifacts
        run: |
          set -e
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
